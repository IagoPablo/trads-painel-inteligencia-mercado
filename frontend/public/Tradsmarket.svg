<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Fundo com cantos arredondados (Azul Escuro Noturno) -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Borda sutil interna (Azul Primary) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Iniciais TM em Typography Clean -->
  <text 
    x="32" 
    y="41" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="26" 
    font-weight="800" 
    fill="#ffffff" 
    text-anchor="middle" 
    letter-spacing="-1">TM</text>
  
  <!-- Detalhe/Indicador de Gráfico de Mercado no canto superior direito -->
  <circle cx="48" cy="16" r="3.5" fill="#2563eb" />
</svg>
