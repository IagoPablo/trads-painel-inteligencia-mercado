services:
  postgres:
    image: postgres:16-alpine
    container_name: trads-market-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trads_market}
      POSTGRES_USER: ${POSTGRES_USER:-trads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trads_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trads} -d ${POSTGRES_DB:-trads_market}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: trads-market-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trads}:${POSTGRES_PASSWORD:-trads_dev_password}@postgres:5432/${POSTGRES_DB:-trads_market}
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      SYNC_API_KEY: ${SYNC_API_KEY:-trads_dev_sync_key}

    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    command: ["sh", "-c", "npx prisma migrate deploy && node dist/src/main.js"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: trads-market-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data:
